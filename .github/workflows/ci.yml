# Independent CI gate. It runs on every push and pull request, whether or not the change came through the harness.
# The harness (.harness/, CLAUDE.md) runs the same `npm run verify` *before* code reaches this pipeline, and adds
# AI-specific checks (acceptance-criteria trace, LLM architecture review). A harness PASS never replaces this job.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, dependency boundaries, tests + coverage thresholds
        run: npm run verify
      - name: Hard-gate source scans (raw Error, direct alerts/reports coupling, read-only reports)
        run: npx tsx scripts/evaluate-harness.ts
      - name: Build deployable artefact
        run: npm run build && test -f dist/server.js

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build image and smoke-test the bulk-status endpoint
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' storeops-api)" = healthy ] && break; sleep 2; done
          curl -fsS http://localhost:3000/health
          curl -fsS -X PATCH http://localhost:3000/api/activities/bulk-status \
            -H 'Content-Type: application/json' -H 'x-user-id: associate-1' \
            -d '{"ids":["task-1","missing"],"status":"DONE"}' | tee /tmp/bulk.json
          grep -q '"updated":\["task-1"\]' /tmp/bulk.json
          grep -q 'ACTIVITY_NOT_FOUND' /tmp/bulk.json
          docker compose down
